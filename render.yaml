# Render "Blueprint" for the FREE plan (Dashboard → New → Blueprint → pick this repo).
# The free plan has no persistent disk, so posts / uploads / resume / settings are kept in a private GitHub
# repo ("data repo", see PERSIST_GITHUB_REPO) and restored every time the service starts.
# Secrets are asked for during setup and are never stored in Git.
services:
  - type: web
    name: kushal-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true            # redeploys on every push to the branch
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET     # keeps you logged in across restarts
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
      - key: GITHUB_USERNAME
        value: kushal287
      - key: PERSIST_GITHUB_REPO   # your PRIVATE data repo, e.g. kushal287/portfolio-data
        value: kushal287/portfolio-data
      - key: GITHUB_TOKEN          # fine-grained token with Contents read+write on the data repo
        sync: false
